name: Update Dashboard Data

on:
  push:
    branches: [main]
    paths:
      - "source/master.xlsx"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Build data.json from master.xlsx
        run: python scripts/build_data.py source/master.xlsx --out data.json

      - name: Commit and push data.json if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json"
          else
            git commit -m "Auto-update data.json [skip ci]"
            git push
          fi
