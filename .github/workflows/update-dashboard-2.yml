name: Update Dashboard Data

# Runs automatically whenever source/master.xlsx changes on the main branch.
# Rebuilds data.json via scripts/build_data.py and commits it back, which
# triggers GitHub Pages to redeploy with the new numbers.
on:
  push:
    branches: [main]
    paths:
      - "source/master.xlsx"
  workflow_dispatch: {}   # lets you trigger a manual rebuild from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit data.json back

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Build data.json from master.xlsx
        run: python scripts/build_data.py source/master.xlsx --out data.json

      - name: Build access-scoped bundles (if roles.csv exists)
        run: |
          if [ -f access/roles.csv ]; then
            python scripts/build_access_bundles.py
          else
            echo "No access/roles.csv yet — skipping scoped bundles."
          fi

      - name: Commit and push data.json if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add data.json admin arm centre access/cloudflare-policies.md 2>/dev/null || git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update data.json and access bundles"
            git push
          fi
